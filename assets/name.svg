<svg width="700" height="90" viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6e39ea" />
      <stop offset="33%" stop-color="#2084ee" />
      <stop offset="66%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#65cd2d" />

      <!-- Animate gradient movement (equivalent to background-position animation) -->
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="0 0; 200 0; 0 0"
        dur="2s"
        repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle"
        font-size="60" font-weight="800" fill="url(#grad)">
    Mangesh Bandre
  </text>
</svg>
